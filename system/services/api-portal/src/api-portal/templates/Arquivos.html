<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivos cadastrados</title>
    <link rel="stylesheet" href="/static/css/styles_arquivos.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">Portal AgroBot <img src="/static/image.png" alt="AgroBot" style="height: 30px;"></a>
        <div class="nav-links">
            <a href="/arquivos">Arquivos</a>
            <a href="/chat-web">Chat Web</a>
            {% if current_user and current_user.credential == "admin" %}
            <a href="/usuarios">Usuarios</a>
            {% endif %}
            <form action="/logout" method="post" style="margin: 0;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main class="container">
        <div class="topbar">
            <h1>Arquivos registrados</h1>
            <div class="topbar-actions">
                <label for="page-size">Itens por pagina:</label>
                <select id="page-size">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <button onclick="window.location.href='/procesamento_arquivos'">Adicionar arquivo</button>
            </div>
        </div>

        <div id="status" class="status"></div>

        <div id="empty-state" class="empty">Nenhum arquivo registrado.</div>

        <div id="table-wrapper" class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Hash</th>
                        <th>Status</th>
                        <th>Criado em</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>

        <div id="pagination" class="pagination">
            <div id="page-info"></div>
            <div>
                <button id="prev-btn">Anterior</button>
                <button id="next-btn">Proxima</button>
            </div>
        </div>
    </main>

    <script>
        const state = {
            page: 1,
            pageSize: 25,
            total: 0,
            loading: false,
        };

        const statusEl = document.getElementById("status");
        const rowsEl = document.getElementById("rows");
        const emptyEl = document.getElementById("empty-state");
        const tableWrapperEl = document.getElementById("table-wrapper");
        const pageInfoEl = document.getElementById("page-info");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const pageSizeEl = document.getElementById("page-size");

        function setStatus(type, message) {
            statusEl.className = "status";
            statusEl.textContent = "";
            if (!message) {
                return;
            }
            statusEl.classList.add(type);
            statusEl.textContent = message;
        }

        function formatDate(dateString) {
            if (!dateString) return "-";
            const date = new Date(dateString);
            return date.toLocaleString("pt-BR");
        }

        function renderStatusBadge(status) {
            if (status === "processado") {
                return `<span class="status-badge status-processado">Processado</span>`;
            }
            if (status === "erro") {
                return `<span class="status-badge status-erro">Erro</span>`;
            }
            return `<span class="status-badge status-em-processamento">Em processamento</span>`;
        }

        function renderRows(items) {
            rowsEl.innerHTML = "";
            items.forEach((item) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.hash}</td>
                    <td>${renderStatusBadge(item.status_processamento)}</td>
                    <td>${formatDate(item.created_at)}</td>
                    <td>
                        <div class="actions">
                            <a class="link-btn" href="/arquivos/${item.id}">Ver arquivo</a>
                            <button class="danger" data-delete-id="${item.id}">Excluir arquivo</button>
                        </div>
                    </td>
                `;
                rowsEl.appendChild(tr);
            });
        }

        function updatePaginationControls() {
            const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
            pageInfoEl.textContent = `Pagina ${state.page} de ${totalPages} (${state.total} registro(s))`;
            prevBtn.disabled = state.page <= 1 || state.loading;
            nextBtn.disabled = state.page >= totalPages || state.loading;
            document.getElementById("pagination").style.display = state.total > 0 ? "flex" : "none";
        }

        async function loadList() {
            state.loading = true;
            setStatus("loading", "Carregando lista...");
            updatePaginationControls();
            try {
                const response = await fetch(`/api/files?page=${state.page}&page_size=${state.pageSize}`);
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao buscar lista de arquivos.");
                }

                state.total = payload.total;
                const items = payload.items || [];

                if (items.length === 0) {
                    rowsEl.innerHTML = "";
                    tableWrapperEl.style.display = "none";
                    emptyEl.style.display = "block";
                    setStatus("", "");
                } else {
                    tableWrapperEl.style.display = "block";
                    emptyEl.style.display = "none";
                    renderRows(items);
                    setStatus("", "");
                }
            } catch (error) {
                setStatus("error", error.message || "Erro ao carregar arquivos.");
            } finally {
                state.loading = false;
                updatePaginationControls();
            }
        }

        async function deleteItem(fileId) {
            const confirmed = window.confirm("Confirma a exclusao do arquivo?");
            if (!confirmed) return;

            setStatus("loading", "Excluindo arquivo...");
            try {
                const response = await fetch(`/api/files/${fileId}`, { method: "DELETE" });
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao excluir arquivo.");
                }

                setStatus("success", "Arquivo excluido com sucesso.");
                await loadList();

                if (state.total > 0) {
                    const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
                    if (state.page > totalPages) {
                        state.page = totalPages;
                        await loadList();
                    }
                } else if (state.page > 1) {
                    state.page -= 1;
                    await loadList();
                }
            } catch (error) {
                setStatus("error", error.message || "Erro ao excluir arquivo.");
            }
        }

        rowsEl.addEventListener("click", async (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const fileId = target.getAttribute("data-delete-id");
            if (!fileId) return;
            await deleteItem(fileId);
        });

        prevBtn.addEventListener("click", async () => {
            if (state.page <= 1) return;
            state.page -= 1;
            await loadList();
        });

        nextBtn.addEventListener("click", async () => {
            const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
            if (state.page >= totalPages) return;
            state.page += 1;
            await loadList();
        });

        pageSizeEl.addEventListener("change", async (event) => {
            const selected = Number(event.target.value);
            if (![25, 50, 100].includes(selected)) return;
            state.pageSize = selected;
            state.page = 1;
            await loadList();
        });

        loadList();
    </script>
</body>
</html>
