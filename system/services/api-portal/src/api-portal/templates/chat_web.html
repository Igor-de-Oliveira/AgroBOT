<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Web | Portal AgroBot</title>
    <link rel="stylesheet" href="/static/css/styles_chat_web.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">Portal AgroBot <img src="/static/image.png" alt="AgroBot" style="height: 30px;"></a>
        <div class="nav-links">
            <a href="/arquivos">Arquivos</a>
            <a href="/chat-web">Chat Web</a>
            {% if current_user and current_user.credential == "admin" %}
            <a href="/usuarios">Usuarios</a>
            {% endif %}
            <form action="/logout" method="post" style="margin: 0;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main class="container">
        <section class="chat-card">
            <h1>Chat Web</h1>
            <p class="subtitle">Converse com o AgroBOT.</p>
            <div id="status" class="status"></div>
            <div id="messages" class="messages" aria-live="polite"></div>
            <form id="chat-form" class="chat-form">
                <label for="chat-input">Pergunta</label>
                <textarea id="chat-input" rows="3" maxlength="4000" placeholder="Digite sua pergunta..." required></textarea>
                <button id="send-btn" type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <script>
        const state = { loading: false };
        const statusEl = document.getElementById("status");
        const messagesEl = document.getElementById("messages");
        const formEl = document.getElementById("chat-form");
        const inputEl = document.getElementById("chat-input");
        const sendBtnEl = document.getElementById("send-btn");

        function setStatus(type, message) {
            statusEl.className = "status";
            statusEl.textContent = "";
            if (!message) {
                return;
            }
            statusEl.classList.add(type);
            statusEl.textContent = message;
        }

        function setLoading(loading) {
            state.loading = loading;
            sendBtnEl.disabled = loading;
            inputEl.disabled = loading;
        }

        function addMessage(role, text) {
            const wrapper = document.createElement("div");
            wrapper.className = `msg msg-${role}`;

            const roleEl = document.createElement("div");
            roleEl.className = "msg-role";
            roleEl.textContent = role === "user" ? "Voce" : "AgroBOT";

            const textEl = document.createElement("div");
            textEl.className = "msg-text";
            textEl.textContent = text;

            wrapper.appendChild(roleEl);
            wrapper.appendChild(textEl);
            messagesEl.appendChild(wrapper);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        formEl.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (state.loading) return;

            const message = inputEl.value.trim();
            if (!message) {
                setStatus("error", "Digite uma pergunta antes de enviar.");
                return;
            }

            addMessage("user", message);
            inputEl.value = "";
            setStatus("loading", "Aguardando resposta...");
            setLoading(true);

            try {
                const response = await fetch("/api/chat/web", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message }),
                });
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao obter resposta do bot.");
                }

                addMessage("bot", payload.reply || "Sem resposta.");
                setStatus("", "");
            } catch (error) {
                setStatus("error", error.message || "Nao foi possivel enviar sua pergunta agora.");
            } finally {
                setLoading(false);
                inputEl.focus();
            }
        });
    </script>
</body>
</html>
