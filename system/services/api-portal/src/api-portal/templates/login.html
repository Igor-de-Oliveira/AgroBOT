<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portal AgroBot</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: min(100%, 420px);
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .status {
            margin: 12px 0;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .status.loading {
            display: block;
            background: #e9f2ff;
            color: #1f4e85;
        }

        .status.error {
            display: block;
            background: #ffe9e9;
            color: #9d1f1f;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input {
            border-radius: 6px;
            border: 1px solid #cad4e0;
            padding: 10px;
            font-size: 14px;
        }

        button {
            border-radius: 6px;
            border: 1px solid #cad4e0;
            background: #ffffff;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="header">
            <img src="/static/image.png" alt="AgroBot" style="height: 32px;">
            <h1 style="margin: 0; font-size: 22px;">Portal AgroBot</h1>
        </div>

        <p>Faca login para continuar.</p>

        <div id="status" class="status {% if error_message %}error{% endif %}">{% if error_message %}{{ error_message }}{% endif %}</div>

        <form id="login-form" method="post" action="/login">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required maxlength="120" autocomplete="username">

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required maxlength="256" autocomplete="current-password">

            <button type="submit">Entrar</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const statusEl = document.getElementById("status");

        form.addEventListener("submit", () => {
            statusEl.className = "status loading";
            statusEl.textContent = "Autenticando...";
        });
    </script>
</body>
</html>
