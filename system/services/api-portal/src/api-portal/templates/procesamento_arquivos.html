<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processar arquivos</title>
    <link rel="stylesheet" href="/static/css/styles_procesamento_arquivos.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">Portal AgroBot <img src="/static/image.png" alt="AgroBot" style="height: 30px;"></a>
        <div class="nav-links">
            <a href="/arquivos">Arquivos</a>
            {% if current_user and current_user.credential == "admin" %}
            <a href="/usuarios">Usuarios</a>
            {% endif %}
            <form action="/logout" method="post" style="margin: 0;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main class="container">
        <div class="card">
            <h1>Processamento de arquivo</h1>
            <div id="status" class="status"></div>

            <div class="form-grid">
                <label for="file-upload">Selecione um arquivo para processar:</label>
                <input type="file" id="file-upload" name="file-upload" accept=".ods,.xlsx,.csv">
                <button id="process-button">Processar</button>
            </div>
        </div>
    </main>

    <script>
        const input = document.getElementById("file-upload");
        const processButton = document.getElementById("process-button");
        const statusEl = document.getElementById("status");

        function setStatus(type, message) {
            statusEl.className = "status";
            statusEl.textContent = "";
            if (!message) {
                return;
            }
            statusEl.classList.add(type);
            statusEl.textContent = message;
        }

        processButton.addEventListener("click", async () => {
            const file = input.files[0];
            if (!file) {
                setStatus("error", "Selecione um arquivo antes de processar.");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            setStatus("loading", "Enviando arquivo...");
            try {
                const response = await fetch("/process_ods", {
                    method: "POST",
                    body: formData,
                });

                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao enviar arquivo.");
                }

                setStatus("success", "Arquivo enviado com sucesso.");
                input.value = "";
            } catch (error) {
                setStatus("error", error.message || "Erro ao enviar arquivo.");
            }
        });
    </script>
</body>
</html>
