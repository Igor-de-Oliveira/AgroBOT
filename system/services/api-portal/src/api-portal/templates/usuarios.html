<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestao de usuarios</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            padding: 0 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links a, .nav-links button {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-links a:hover, .nav-links button:hover {
            background-color: #34495e;
        }

        .container {
            max-width: 1380px;
            width: min(96vw, 1380px);
            margin: 24px auto;
            padding: 0 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(300px, 420px) 1fr;
            gap: 16px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 16px;
        }

        .status {
            margin: 12px 0;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .status.loading {
            display: block;
            background: #e9f2ff;
            color: #1f4e85;
        }

        .status.error {
            display: block;
            background: #ffe9e9;
            color: #9d1f1f;
        }

        .status.success {
            display: block;
            background: #e8f7ed;
            color: #1a6a39;
        }

        form {
            display: grid;
            gap: 10px;
        }

        input, select {
            border-radius: 6px;
            border: 1px solid #cad4e0;
            padding: 9px;
            font-size: 14px;
        }

        button, .link-btn {
            border-radius: 6px;
            border: 1px solid #cad4e0;
            background: #ffffff;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            color: #2c3e50;
        }

        .danger {
            border-color: #d9534f;
            color: #b22b27;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 860px;
        }

        th, td {
            padding: 9px 8px;
            border-bottom: 1px solid #eceff3;
            text-align: left;
            font-size: 14px;
            vertical-align: middle;
        }

        th {
            background: #eef3fa;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .badge-active {
            background: #e8f7ed;
            color: #1a6a39;
            border-color: #bfe8cc;
        }

        .badge-inactive {
            background: #ffe9e9;
            color: #9d1f1f;
            border-color: #f6bcbc;
        }

        .empty {
            display: none;
            color: #4b5b6b;
            padding: 16px 0;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            th, td {
                font-size: 13px;
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">Portal AgroBot <img src="/static/image.png" alt="AgroBot" style="height: 30px;"></a>
        <div class="nav-links">
            <a href="/arquivos">Arquivos</a>
            <a href="/usuarios">Usuarios</a>
            <form action="/logout" method="post" style="margin: 0;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main class="container">
        <h1>Gestao de usuarios</h1>
        <div id="status" class="status"></div>

        <div class="grid">
            <section class="card">
                <h2 id="form-title">Cadastrar usuario</h2>
                <form id="user-form">
                    <input type="hidden" id="editing-id" value="">

                    <label for="username">Username</label>
                    <input type="text" id="username" required minlength="3" maxlength="120">

                    <label for="credential">Credential</label>
                    <select id="credential" required>
                        <option value="usuario">usuario</option>
                        <option value="admin">admin</option>
                    </select>

                    <label for="is-active">Status</label>
                    <select id="is-active" required>
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>

                    <label for="password">Senha</label>
                    <input type="password" id="password" minlength="8" maxlength="256" placeholder="Obrigatoria no cadastro">

                    <div class="actions">
                        <button type="submit" id="save-button">Salvar</button>
                        <button type="button" id="cancel-button" style="display:none;">Cancelar edicao</button>
                    </div>
                </form>
            </section>

            <section class="card">
                <h2>Usuarios cadastrados</h2>
                <div id="empty-state" class="empty">Nenhum usuario registrado.</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Credential</th>
                                <th>Status</th>
                                <th>Criado em</th>
                                <th>Ultimo login</th>
                                <th>Acoes</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        const statusEl = document.getElementById("status");
        const rowsEl = document.getElementById("rows");
        const emptyStateEl = document.getElementById("empty-state");

        const userForm = document.getElementById("user-form");
        const editingIdEl = document.getElementById("editing-id");
        const formTitleEl = document.getElementById("form-title");
        const usernameEl = document.getElementById("username");
        const credentialEl = document.getElementById("credential");
        const isActiveEl = document.getElementById("is-active");
        const passwordEl = document.getElementById("password");
        const cancelButton = document.getElementById("cancel-button");

        const state = {
            users: [],
            loading: false,
        };

        function setStatus(type, message) {
            statusEl.className = "status";
            statusEl.textContent = "";
            if (!message) {
                return;
            }
            statusEl.classList.add(type);
            statusEl.textContent = message;
        }

        function formatDate(dateString) {
            if (!dateString) return "-";
            return new Date(dateString).toLocaleString("pt-BR");
        }

        function renderRows() {
            rowsEl.innerHTML = "";

            if (!state.users.length) {
                emptyStateEl.style.display = "block";
                return;
            }

            emptyStateEl.style.display = "none";

            state.users.forEach((user) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.credential}</td>
                    <td>
                        <span class="badge ${user.is_active ? "badge-active" : "badge-inactive"}">
                            ${user.is_active ? "Ativo" : "Inativo"}
                        </span>
                    </td>
                    <td>${formatDate(user.created_at)}</td>
                    <td>${formatDate(user.last_login_at)}</td>
                    <td>
                        <div class="actions">
                            <button data-edit-id="${user.id}">Editar</button>
                            <button class="danger" data-deactivate-id="${user.id}">Inativar</button>
                            <button class="danger" data-delete-id="${user.id}">Remover</button>
                        </div>
                    </td>
                `;
                rowsEl.appendChild(tr);
            });
        }

        async function loadUsers() {
            state.loading = true;
            setStatus("loading", "Carregando usuarios...");
            try {
                const response = await fetch("/api/users");
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao buscar usuarios.");
                }

                state.users = payload.items || [];
                renderRows();
                setStatus("", "");
            } catch (error) {
                setStatus("error", error.message || "Erro ao carregar usuarios.");
            } finally {
                state.loading = false;
            }
        }

        function resetForm() {
            editingIdEl.value = "";
            formTitleEl.textContent = "Cadastrar usuario";
            usernameEl.value = "";
            credentialEl.value = "usuario";
            isActiveEl.value = "true";
            passwordEl.value = "";
            passwordEl.placeholder = "Obrigatoria no cadastro";
            passwordEl.required = true;
            cancelButton.style.display = "none";
        }

        function fillForm(user) {
            editingIdEl.value = String(user.id);
            formTitleEl.textContent = `Editando usuario #${user.id}`;
            usernameEl.value = user.username;
            credentialEl.value = user.credential;
            isActiveEl.value = String(user.is_active);
            passwordEl.value = "";
            passwordEl.placeholder = "Opcional na edicao";
            passwordEl.required = false;
            cancelButton.style.display = "inline-block";
        }

        async function submitForm(event) {
            event.preventDefault();

            const editingId = editingIdEl.value;
            const payload = {
                username: usernameEl.value.trim(),
                credential: credentialEl.value,
                is_active: isActiveEl.value === "true",
            };

            const rawPassword = passwordEl.value;
            if (!editingId) {
                if (!rawPassword || rawPassword.length < 8) {
                    setStatus("error", "Senha obrigatoria com no minimo 8 caracteres.");
                    return;
                }
                payload.password = rawPassword;
            } else if (rawPassword) {
                if (rawPassword.length < 8) {
                    setStatus("error", "Senha opcional deve ter no minimo 8 caracteres.");
                    return;
                }
                payload.password = rawPassword;
            }

            const endpoint = editingId ? `/api/users/${editingId}` : "/api/users";
            const method = editingId ? "PUT" : "POST";
            const loadingMessage = editingId ? "Atualizando usuario..." : "Cadastrando usuario...";

            setStatus("loading", loadingMessage);
            try {
                const response = await fetch(endpoint, {
                    method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const responsePayload = await response.json();
                if (!response.ok) {
                    throw new Error(responsePayload.detail || "Falha ao salvar usuario.");
                }

                setStatus("success", editingId ? "Usuario atualizado com sucesso." : "Usuario cadastrado com sucesso.");
                resetForm();
                await loadUsers();
            } catch (error) {
                setStatus("error", error.message || "Erro ao salvar usuario.");
            }
        }

        async function deactivateUser(userId) {
            const confirmed = window.confirm("Confirma a inativacao do usuario?");
            if (!confirmed) return;

            setStatus("loading", "Inativando usuario...");
            try {
                const response = await fetch(`/api/users/${userId}/deactivate`, { method: "POST" });
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao inativar usuario.");
                }

                setStatus("success", "Usuario inativado com sucesso.");
                await loadUsers();
            } catch (error) {
                setStatus("error", error.message || "Erro ao inativar usuario.");
            }
        }

        async function deleteUser(userId) {
            const confirmed = window.confirm("Confirma a remocao fisica do usuario?");
            if (!confirmed) return;

            setStatus("loading", "Removendo usuario...");
            try {
                const response = await fetch(`/api/users/${userId}`, { method: "DELETE" });
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || "Falha ao remover usuario.");
                }

                setStatus("success", "Usuario removido com sucesso.");
                await loadUsers();
            } catch (error) {
                setStatus("error", error.message || "Erro ao remover usuario.");
            }
        }

        rowsEl.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;

            const editId = target.getAttribute("data-edit-id");
            if (editId) {
                const user = state.users.find((item) => item.id === Number(editId));
                if (user) {
                    fillForm(user);
                }
                return;
            }

            const deactivateId = target.getAttribute("data-deactivate-id");
            if (deactivateId) {
                deactivateUser(Number(deactivateId));
                return;
            }

            const deleteId = target.getAttribute("data-delete-id");
            if (deleteId) {
                deleteUser(Number(deleteId));
            }
        });

        cancelButton.addEventListener("click", () => {
            resetForm();
            setStatus("", "");
        });

        userForm.addEventListener("submit", submitForm);

        resetForm();
        loadUsers();
    </script>
</body>
</html>
